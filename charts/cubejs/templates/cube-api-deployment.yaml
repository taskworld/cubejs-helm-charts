apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: cube-api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.cubeApi.replicas }}
  {{- end }}
  selector:
    matchLabels:
      cubejsApp: cubeApi
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        cubejsApp: cubeApi
        app.kubernetes.io/component: cube-api
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.cubeApi.modelsConfigMap }}
      initContainers:
        # Cube walks the schema directory recursively and follows symlinks without skipping
        # dot-directories, so mounting the models ConfigMap there directly feeds it the kubelet's
        # `..data` and `..<timestamp>` copies as well and every cube compiles two to three times
        # ("Found duplicate cube name"). Copying the keys out flattens the mount to plain files.
        - name: copy-models
          image: "{{ .Values.cubeApi.image }}"
          imagePullPolicy: {{ .Values.cubeApi.pullPolicy }}
          command: ["sh", "-c", "cp /models-src/* /cube/conf/model/"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: cube-models-src
              mountPath: /models-src
              readOnly: true
            - name: cube-models
              mountPath: /cube/conf/model
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.cubeApi.configmap.name }}
            {{- if .Values.cubeApi.secret }}
            - secretRef:
                name: {{ .Values.cubeApi.secret.name }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.cubeApi.image }}"
          imagePullPolicy: {{ .Values.cubeApi.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cubeApi.service.port }}
              protocol: TCP
            {{- if .Values.cubeApi.sql.enabled }}
            - name: pg-sql
              containerPort: {{ .Values.cubeApi.sql.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            {{- include "chart.schemaReadinessProbe" .Values.cubeApi.service.port | nindent 12 }}
          resources:
            {{- toYaml .Values.cubeApi.resources | nindent 12 }}
          {{- if or .Values.cubeApi.modelsConfigMap .Values.cubeApi.projectConfigMap }}
          volumeMounts:
            {{- if .Values.cubeApi.modelsConfigMap }}
            - name: cube-models
              mountPath: /cube/conf/model
            {{- end }}
            {{- if .Values.cubeApi.projectConfigMap }}
            - name: cube-config
              mountPath: /cube/conf/cube.js
              subPath: cube.js
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.cubeApi.modelsConfigMap .Values.cubeApi.projectConfigMap }}
      volumes:
        {{- if .Values.cubeApi.modelsConfigMap }}
        - name: cube-models-src
          configMap:
            name: {{ .Values.cubeApi.modelsConfigMap }}
        - name: cube-models
          emptyDir: {}
        {{- end }}
        {{- if .Values.cubeApi.projectConfigMap }}
        - name: cube-config
          configMap:
            name: {{ .Values.cubeApi.projectConfigMap }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
