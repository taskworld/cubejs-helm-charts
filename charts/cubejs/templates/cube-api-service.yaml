apiVersion: v1
kind: Service
metadata:
  name: cube-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cubeApi.service.type }}
  ports:
    - port: {{ .Values.cubeApi.service.service_port }}
      targetPort: {{ .Values.cubeApi.service.port }}
      protocol: TCP
      name: http
      appProtocol: http
    {{- if .Values.cubeApi.sql.enabled }}
    - port: {{ .Values.cubeApi.sql.port }}
      targetPort: pg-sql
      protocol: TCP
      name: pg-sql
      appProtocol: tcp
    {{- end }}
  selector:
    cubejsApp: cubeApi
