apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-refresh-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: cube-refresh-worker
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.cubeRefreshWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      cubejsApp: cubeRefreshWorker
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        cubejsApp: cubeRefreshWorker
        app.kubernetes.io/component: cube-refresh-worker
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.cubeRefreshWorker.modelsConfigMap }}
      initContainers:
        # The refresh worker compiles the same schema, so it needs the same flattened copy of the
        # models ConfigMap: mounted as a directory at the schema path, Cube also reads the kubelet's
        # `..data` and `..<timestamp>` copies and rejects the duplicates ("Found duplicate cube
        # name"). See cube-api-deployment.yaml for the same block.
        - name: copy-models
          image: "{{ .Values.cubeRefreshWorker.image }}"
          imagePullPolicy: {{ .Values.cubeRefreshWorker.pullPolicy }}
          command: ["sh", "-c", "cp /models-src/* /cube/conf/model/"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: cube-models-src
              mountPath: /models-src
              readOnly: true
            - name: cube-models
              mountPath: /cube/conf/model
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
            - configMapRef:
                name: {{ .Values.cubeRefreshWorker.configmap.name }}
            {{- if .Values.cubeRefreshWorker.secret }}
            - secretRef:
                name: {{ .Values.cubeRefreshWorker.secret.name }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.cubeRefreshWorker.image }}"
          imagePullPolicy: {{ .Values.cubeRefreshWorker.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cubeRefreshWorker.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            {{- include "chart.schemaReadinessProbe" .Values.cubeRefreshWorker.service.port | nindent 12 }}
          resources:
            {{- toYaml .Values.cubeRefreshWorker.resources | nindent 12 }}
          {{- if or .Values.cubeRefreshWorker.modelsConfigMap .Values.cubeRefreshWorker.projectConfigMap }}
          volumeMounts:
            {{- if .Values.cubeRefreshWorker.modelsConfigMap }}
            - name: cube-models
              mountPath: /cube/conf/model
            {{- end }}
            {{- if .Values.cubeRefreshWorker.projectConfigMap }}
            - name: cube-config
              mountPath: /cube/conf/cube.js
              subPath: cube.js
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.cubeRefreshWorker.modelsConfigMap .Values.cubeRefreshWorker.projectConfigMap }}
      volumes:
        {{- if .Values.cubeRefreshWorker.modelsConfigMap }}
        - name: cube-models-src
          configMap:
            name: {{ .Values.cubeRefreshWorker.modelsConfigMap }}
        - name: cube-models
          emptyDir: {}
        {{- end }}
        {{- if .Values.cubeRefreshWorker.projectConfigMap }}
        - name: cube-config
          configMap:
            name: {{ .Values.cubeRefreshWorker.projectConfigMap }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
