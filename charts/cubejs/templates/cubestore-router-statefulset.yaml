apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cubestore-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: cubestore-router
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  serviceName: cubestore-router
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.cubestoreRouter.replicas }}
  {{- end }}
  selector:
    matchLabels:
      cubejsApp: cubestoreRouter
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        cubejsApp: cubestoreRouter
        app.kubernetes.io/component: cubestore-router
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_SERVER_NAME
              value: "$(POD_NAME).cubestore-router:{{ .Values.cubestoreRouter.service.port }}"
            - name: CUBESTORE_WORKERS
              value: {{ include "chart.cubestoreWorkers" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.cubestoreRouter.configmap.name }}
          command: ["/bin/sh", "-c"]
          args: ["unset CUBESTORE_WORKER_PORT; ./cubestored"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.cubestoreRouter.image }}"
          imagePullPolicy: {{ .Values.cubestoreRouter.pullPolicy }}
          ports:
            - name: tcp-meta
              containerPort: {{ .Values.cubestoreRouter.service.port }}
              protocol: TCP
            - name: http
              containerPort: 3030
              protocol: TCP
            - name: mysql-compat
              containerPort: 3306
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: 3031
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3031
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cubestore-data
              mountPath: /cube/.cubestore/data
          resources:
            {{- toYaml .Values.cubestoreRouter.resources | nindent 12 }}
        # Cubestore writes a RocksDB checkpoint to local disk every ~5 min and never
        # removes it: delete_old_snapshots() in metastore/rocks_fs.rs prunes remote
        # storage only. Checkpoints hard-link SST files, so every SST ever written stays
        # pinned — a 469M live cachestore held 48Gi of disk before this existed.
        # Upstream: github.com/cube-js/cube/issues/9114 (same bug, temp-uploads).
        # Delete this sidecar once Cubestore cleans up after itself.
        - name: checkpoint-janitor
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["/bin/sh", "-c"]
          args:
            - |
              d=/cube/.cubestore/data
              while true; do
                for s in cachestore metastore; do
                  cur=$(cat "$d/$s-current" 2>/dev/null)
                  # No pointer means we can't tell which checkpoint is live — skip, don't guess.
                  [ -n "$cur" ] || continue
                  find "$d" -maxdepth 1 -type d -name "$s-*" -mmin +120 \
                    ! -name "$cur" ! -name "$cur-logs" -exec rm -rf {} + 2>/dev/null
                done
                echo "janitor: pass done, $(df -h "$d" | awk 'NR==2{print $5}') used"
                sleep 600
              done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: cubestore-data
              mountPath: /cube/.cubestore/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: cubestore-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.cubestoreRouter.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.cubestoreRouter.persistence.size | quote }}
